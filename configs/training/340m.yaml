# Training recipe for the 340M models: 15B tokens, 8 GPUs, 0.5M-token batches.
data:
  dataset: HuggingFaceFW/fineweb-edu
  dataset_config: sample-100BT
  tokenizer: meta-llama/Llama-2-7b-hf
  sequence_length: 4096
  shuffle_buffer: 10000
  document_separator: bos  # <s> before every document

optimization:
  target_tokens: 15000000000
  max_steps: 28610
  warmup_steps: 954
  peak_lr: 0.0004
  min_lr: 0.00004
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  max_grad_norm: 1.0

runtime:
  precision: bf16
  expected_world_size: 8
  micro_batch_size: 8
  gradient_accumulation_steps: 2
  global_batch_tokens: 524288
  num_workers: 0
  seed: 42
  log_every: 10

checkpoint:
  save_every: 1000
  keep_last: 2
